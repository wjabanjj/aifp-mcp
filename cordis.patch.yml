# AiFP 记忆感知系统 — DeepSeek Harness (dsh) 配置层
#
# 安装 aifp-mcp 后自动接入 dsh（npm install -g aifp-mcp），
# 本文件为手动配置示例，一般无需手动创建。
#
# 本层通过 dsh 内置的 MCP 客户端插件拉起 aifp-mcp 的 MCP server，
# 并把全部记忆工具注册为 mcp__aifp__* 供模型使用。
#
# 工具名示例：mcp__aifp__search_memories、mcp__aifp__save_memory 等

- insert:
    - id: memory-aifp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ai-cognition
        transport: stdio
        command: npx
        args: ['-y', 'aifp-mcp']
